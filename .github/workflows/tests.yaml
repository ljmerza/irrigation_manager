name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Same pins as the local test environment. pytest-homeassistant-custom-component
      # 0.13.205 pins homeassistant==2025.1.4, which pins aiohasupervisor==0.2.2b5;
      # uv rejects that pre-release unless it's allowed.
      - uses: ljmerza/misc-actions/actions/python-test@v2
        with:
          python-version: "3.12"
          requirements-file: requirements_test.txt
          prerelease: allow

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    # Not blocking yet: the code still has unsorted imports. Remove this line
    # after running `ruff check --fix` once (see docs/hacs.md). Kept as a local
    # job because misc-actions' ruff-lint needs a uv.lock and also runs
    # `ruff format --check`.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.15.10
      - name: Ruff check
        run: ruff check custom_components tests assets

  frontend:
    name: Panel bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # npm ci from frontend/package-lock.json, then `npm run build`.
      - uses: ljmerza/misc-actions/actions/npm-build@v2
        with:
          working-directory: frontend
          node-version: "22"
          pack: "false"
          artifact-name: ""
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Committed bundle matches the build
        run: git diff --exit-code -- custom_components/irrigation_manager/www/irrigation-manager-panel.js
