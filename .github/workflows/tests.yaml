name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the local test environment: pytest-homeassistant-custom-component
          # 0.13.205 pins homeassistant==2025.1.4.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    # Not blocking yet: the code still has unsorted imports. Remove this line
    # after running `ruff check --fix` once (see docs/hacs.md).
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.15.10
      - name: Ruff check
        run: ruff check custom_components tests assets

  frontend:
    name: Panel bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::frontend/package-lock.json is missing; installing unpinned dependencies"
            npm install --no-audit --no-fund
          fi
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Committed bundle matches the build
        run: |
          if [ ! -f package-lock.json ]; then
            # Without a lockfile the dependency versions float, so a byte-for-byte
            # comparison can fail for reasons unrelated to the source.
            echo "::warning::Skipping bundle comparison until frontend/package-lock.json is committed"
            exit 0
          fi
          git diff --exit-code -- ../custom_components/irrigation_manager/www/irrigation-manager-panel.js
